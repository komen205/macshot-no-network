name: No-network build

on:
  push:
    branches: [main, codex/no-network]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: no-network-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26
        run: |
          selected_xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$selected_xcode/Contents/Developer"
          xcodebuild -version
      - name: Run unit tests
        run: bash scripts/run-tests.sh
      - name: Build and verify sandbox network denial
        run: bash scripts/build-no-network.sh
      - name: Upload locally signed app
        uses: actions/upload-artifact@v4
        with:
          name: MacShot-No-Network
          path: build/dist/MacShot-No-Network.zip
          retention-days: 14
